<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#080c24;font-family:"Arial Black",Arial,Helvetica,sans-serif;color:#eef0fa;}
.bg{position:absolute;top:0;left:0;width:1080px;height:1920px;object-fit:cover;object-position:top;}
.scrim-top{position:absolute;top:0;left:0;right:0;height:420px;background:linear-gradient(180deg,rgba(6,9,26,.95) 0%,rgba(6,9,26,.75) 55%,transparent 100%);}
.caption{position:absolute;top:150px;left:60px;right:60px;font-size:62px;font-weight:900;line-height:1.12;letter-spacing:-1px;text-shadow:0 8px 28px rgba(0,0,0,.6);}
.caption b{color:#c1f807;}
.caption .orange{color:#f65334;}
</style></head>
<body>
<img class="bg" src="../real/01-mijugador.jpg">
<div class="scrim-top"></div>
<div class="caption">Cada jugador tiene <b>su carta</b></div>
</body></html>
