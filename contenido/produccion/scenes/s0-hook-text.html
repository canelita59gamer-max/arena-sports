<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#06091a;font-family:"Arial Black",Arial,Helvetica,sans-serif;color:#eef0fa;}
.bg{position:absolute;inset:0;background:
  radial-gradient(circle at 50% 30%, rgba(193,248,7,.10) 0%, transparent 55%),
  #06091a;
}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 2px, transparent 2px);background-size:46px 46px;opacity:.5;}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px;}
.headline{font-size:108px;font-weight:900;line-height:1.05;letter-spacing:-2px;text-align:center;}
.headline .lime{color:#c1f807;}
</style></head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="wrap">
  <div class="headline">Así se enteran<br>los <span class="lime">papás</span><br>de todo.</div>
</div>
</body></html>
