<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.stage{position:relative;width:1080px;height:1920px;}
.phone{
  position:absolute; top:260px; left:140px; width:800px; height:1300px;
  background:#0c1430; border-radius:60px; border:4px solid rgba(255,255,255,.12);
  box-shadow:0 60px 140px rgba(0,0,0,.65);
  padding:50px 46px; overflow:hidden;
}
.app-top{display:flex;justify-content:space-between;align-items:center;}
.app-title{font-size:36px;font-weight:900;}
.streak{
  display:flex;align-items:center;gap:10px;background:rgba(246,83,52,.18);
  border:2px solid #f65334;border-radius:40px;padding:10px 26px;font-size:30px;font-weight:800;color:#ffb199;
}
.week{display:flex;justify-content:space-between;margin-top:60px;}
.day{display:flex;flex-direction:column;align-items:center;gap:14px;}
.day .lbl{font-size:24px;color:rgba(255,255,255,.5);font-weight:700;}
.dot{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.07);border:3px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:36px;}
.dot.done{background:#c1f807;border-color:#c1f807;color:#0e1736;font-weight:900;}
.progress-box{margin-top:90px;background:rgba(255,255,255,.06);border-radius:30px;padding:46px;}
.progress-box .lbl{font-size:30px;font-weight:800;color:rgba(255,255,255,.7);}
.bigbar{margin-top:26px;height:34px;border-radius:17px;background:rgba(255,255,255,.1);overflow:hidden;}
.bigbar .fill{height:100%;width:74%;border-radius:17px;background:linear-gradient(90deg,#c1f807,#8fcf00);}
.pct{margin-top:18px;font-size:48px;font-weight:900;color:#c1f807;}
</style></head>
<body>
<div class="caption">Cada entreno queda <b>registrado</b></div>
<div class="stage">
  <div class="phone">
    <div class="app-top"><div class="app-title">Mi semana</div><div class="streak">🔥 5</div></div>
    <div class="week">
      <div class="day"><div class="lbl">L</div><div class="dot done">✓</div></div>
      <div class="day"><div class="lbl">M</div><div class="dot done">✓</div></div>
      <div class="day"><div class="lbl">M</div><div class="dot done">✓</div></div>
      <div class="day"><div class="lbl">J</div><div class="dot done">✓</div></div>
      <div class="day"><div class="lbl">V</div><div class="dot done">✓</div></div>
      <div class="day"><div class="lbl">S</div><div class="dot">·</div></div>
      <div class="day"><div class="lbl">D</div><div class="dot">·</div></div>
    </div>
    <div class="progress-box">
      <div class="lbl">Asistencia del mes</div>
      <div class="bigbar"><div class="fill"></div></div>
      <div class="pct">74%</div>
    </div>
  </div>
</div>
<div class="logo-row">PERFIL DE JUGADOR</div>
</body></html>
