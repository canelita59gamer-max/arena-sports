<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.stage{position:relative;width:1080px;height:1920px;padding-top:280px;}
.chat{width:900px;margin:0 auto;display:flex;flex-direction:column;gap:34px;}
.bubble{
  max-width:720px; padding:30px 34px; border-radius:28px; font-size:32px; font-weight:700;
  line-height:1.35; box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.from-profe{align-self:flex-start;background:#17224e;border:2px solid rgba(255,255,255,.1);border-bottom-left-radius:8px;}
.from-profe .who{font-size:24px;color:#8fe000;font-weight:900;margin-bottom:8px;}
.from-sys{align-self:center;background:rgba(193,248,7,.12);border:2px solid rgba(193,248,7,.4);border-radius:40px;padding:18px 36px;font-size:26px;color:#c1f807;font-weight:800;}
.from-familia{align-self:flex-end;background:#1f6b3a;border-bottom-right-radius:8px;}
.from-familia .who{font-size:24px;color:#bdf5cf;font-weight:900;margin-bottom:8px;}
.check{color:#9fe6ff;font-size:24px;margin-top:10px;text-align:right;}
</style></head>
<body>
<div class="caption">Un mensaje llega a <b>todas</b> las familias</div>
<div class="stage">
  <div class="chat">
    <div class="bubble from-profe"><div class="who">Profe Andrés</div>Entreno mañana 4:00pm, cancha 2. Traer peto claro 🟢</div>
    <div class="from-sys">📲 Enviado a 18 familias · Sub-11</div>
    <div class="bubble from-familia"><div class="who">Mamá de Mateo</div>Listo profe, ahí estamos ✅<div class="check">Visto 17/18</div></div>
  </div>
</div>
<div class="logo-row">PERFIL DE JUGADOR</div>
</body></html>
