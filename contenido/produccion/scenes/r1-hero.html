<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#080c24;font-family:"Arial Black",Arial,Helvetica,sans-serif;color:#eef0fa;}
.crop{position:absolute;top:0;left:0;width:1080px;height:1920px;overflow:hidden;background:#080c24;}
.bg{position:absolute;top:-420px;left:0;width:1080px;height:1920px;object-fit:cover;transform:scale(1.18);transform-origin:center 720px;}
.scrim-top{position:absolute;top:0;left:0;right:0;height:520px;background:linear-gradient(180deg,rgba(6,9,26,.97) 0%,rgba(6,9,26,.6) 65%,transparent 100%);}
.caption{position:absolute;top:1560px;left:60px;right:60px;font-size:60px;font-weight:900;line-height:1.12;letter-spacing:-1px;text-shadow:0 8px 28px rgba(0,0,0,.6);z-index:5;}
.caption b{color:#c1f807;}
.scrim-bottom{position:absolute;bottom:0;left:0;right:0;height:620px;background:linear-gradient(0deg,#06091a 0%,#06091a 68%,transparent 100%);}
</style></head>
<body>
<div class="crop"><img class="bg" src="../real/00-hero.jpg"></div>
<div class="scrim-top"></div>
<div class="scrim-bottom"></div>
<div class="caption">Así se ve <b>tu club</b> en Perfil de Jugador</div>
</body></html>
