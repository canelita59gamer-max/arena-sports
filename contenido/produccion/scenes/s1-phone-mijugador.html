<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#06091a;font-family:"Arial Black",Arial,Helvetica,sans-serif;color:#eef0fa;}
.bg{position:absolute;inset:0;background:
  radial-gradient(circle at 50% 18%, rgba(193,248,7,.09) 0%, transparent 50%),
  #06091a;}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 2px, transparent 2px);background-size:46px 46px;}
.caption{position:absolute;top:150px;left:60px;right:60px;font-size:58px;font-weight:900;line-height:1.1;letter-spacing:-1px;text-align:center;}
.caption b{color:#c1f807;}
.phone{position:absolute;top:400px;left:50%;transform:translateX(-50%);width:640px;height:1288px;border-radius:64px;background:#000;box-shadow:0 60px 120px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.08);overflow:hidden;}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;}
.notch{position:absolute;top:418px;left:50%;transform:translateX(-50%);width:220px;height:36px;background:#000;border-radius:0 0 22px 22px;z-index:5;}
</style></head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div class="caption">La carta de tu hijo, <b>siempre al día</b></div>
<div class="phone"><img src="../real/01-mijugador.jpg"></div>
<div class="notch"></div>
</body></html>
