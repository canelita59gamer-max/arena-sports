<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlowCom" cx="50%" cy="80%" r="90%">
      <stop offset="0%" stop-color="#1a2400"/>
      <stop offset="40%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="crowdFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glowCom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fadeBottomCom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlowCom)"/>

  <!-- stadium light glow at horizon -->
  <ellipse cx="800" cy="560" rx="900" ry="180" fill="#c8f000" opacity="0.10"/>
  <ellipse cx="800" cy="560" rx="500" ry="90" fill="#e8ff00" opacity="0.10"/>

  <!-- light beams -->
  <g fill="#c8f000" opacity="0.07">
    <polygon points="300,560 250,0 400,0"/>
    <polygon points="700,560 680,0 830,0"/>
    <polygon points="1100,560 1120,0 1270,0"/>
  </g>

  <!-- crowd of raised-arm silhouettes -->
  <g fill="#050505" filter="url(#glowCom)">
    <!-- back row -->
    <g opacity="0.55" transform="translate(0,40) scale(0.85)">
      <circle cx="260" cy="470" r="34"/><rect x="234" y="500" width="52" height="90" rx="20"/>
      <line x1="234" y1="520" x2="180" y2="450" stroke="#050505" stroke-width="20" stroke-linecap="round"/>
      <line x1="286" y1="520" x2="340" y2="450" stroke="#050505" stroke-width="20" stroke-linecap="round"/>

      <circle cx="520" cy="470" r="34"/><rect x="494" y="500" width="52" height="90" rx="20"/>
      <line x1="494" y1="520" x2="440" y2="440" stroke="#050505" stroke-width="20" stroke-linecap="round"/>
      <line x1="546" y1="520" x2="600" y2="440" stroke="#050505" stroke-width="20" stroke-linecap="round"/>

      <circle cx="1080" cy="470" r="34"/><rect x="1054" y="500" width="52" height="90" rx="20"/>
      <line x1="1054" y1="520" x2="1000" y2="440" stroke="#050505" stroke-width="20" stroke-linecap="round"/>
      <line x1="1106" y1="520" x2="1160" y2="440" stroke="#050505" stroke-width="20" stroke-linecap="round"/>

      <circle cx="1340" cy="470" r="34"/><rect x="1314" y="500" width="52" height="90" rx="20"/>
      <line x1="1314" y1="520" x2="1260" y2="450" stroke="#050505" stroke-width="20" stroke-linecap="round"/>
      <line x1="1366" y1="520" x2="1420" y2="450" stroke="#050505" stroke-width="20" stroke-linecap="round"/>
    </g>

    <!-- front row, larger, sharper -->
    <g transform="translate(0,120)">
      <circle cx="420" cy="470" r="42"/><rect x="386" y="508" width="68" height="130" rx="26"/>
      <line x1="386" y1="530" x2="310" y2="420" stroke="#050505" stroke-width="26" stroke-linecap="round"/>
      <line x1="454" y1="530" x2="530" y2="420" stroke="#050505" stroke-width="26" stroke-linecap="round"/>

      <circle cx="800" cy="460" r="46"/><rect x="762" y="502" width="76" height="140" rx="28"/>
      <line x1="762" y1="524" x2="680" y2="400" stroke="#050505" stroke-width="28" stroke-linecap="round"/>
      <line x1="838" y1="524" x2="920" y2="400" stroke="#050505" stroke-width="28" stroke-linecap="round"/>

      <circle cx="1180" cy="470" r="42"/><rect x="1146" y="508" width="68" height="130" rx="26"/>
      <line x1="1146" y1="530" x2="1070" y2="420" stroke="#050505" stroke-width="26" stroke-linecap="round"/>
      <line x1="1214" y1="530" x2="1290" y2="420" stroke="#050505" stroke-width="26" stroke-linecap="round"/>
    </g>
  </g>

  <!-- lime rim light tracing the front silhouettes -->
  <g fill="none" stroke="#c8f000" stroke-width="2.5" opacity="0.65" transform="translate(0,120)">
    <circle cx="800" cy="460" r="46"/>
    <path d="M762 524 L680 400 M838 524 L920 400"/>
    <circle cx="420" cy="470" r="42"/>
    <circle cx="1180" cy="470" r="42"/>
  </g>

  <rect y="560" width="1600" height="340" fill="url(#crowdFade)"/>
  <rect width="1600" height="900" fill="url(#fadeBottomCom)"/>
</svg>
