<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlowCorp" cx="70%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a2400"/>
      <stop offset="45%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="skylineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="limeStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8ff00"/>
      <stop offset="100%" stop-color="#7a9c00"/>
    </linearGradient>
    <filter id="glowCorp" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlowCorp)"/>

  <!-- faint corporate grid -->
  <g stroke="#c8f000" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="500" y1="0" x2="500" y2="900"/>
    <line x1="900" y1="0" x2="900" y2="900"/>
    <line x1="1250" y1="0" x2="1250" y2="900"/>
  </g>

  <!-- city skyline silhouette -->
  <g fill="url(#skylineGrad)">
    <rect x="0" y="620" width="140" height="280"/>
    <rect x="150" y="560" width="110" height="340"/>
    <rect x="270" y="640" width="90" height="260"/>
    <rect x="1200" y="600" width="120" height="300"/>
    <rect x="1330" y="520" width="130" height="380"/>
    <rect x="1470" y="660" width="130" height="240"/>
  </g>
  <g stroke="#c8f000" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <rect x="150" y="560" width="110" height="340"/>
    <rect x="1330" y="520" width="130" height="380"/>
  </g>

  <!-- diagonal light streaks -->
  <g stroke="#c8f000" stroke-opacity="0.18" stroke-width="3">
    <line x1="900" y1="0" x2="1600" y2="500"/>
    <line x1="1000" y1="0" x2="1600" y2="380"/>
  </g>

  <!-- central motif: briefcase fused with a ball, glowing -->
  <g filter="url(#glowCorp)" transform="translate(560,300)">
    <circle cx="220" cy="220" r="150" fill="none" stroke="url(#limeStroke)" stroke-width="6"/>
    <path d="M110 180 A155 155 0 0 1 330 180" fill="none" stroke="#c8f000" stroke-width="3" stroke-opacity="0.6"/>
    <path d="M90 260 A155 155 0 0 0 350 260" fill="none" stroke="#c8f000" stroke-width="3" stroke-opacity="0.6"/>
    <rect x="150" y="150" width="140" height="100" rx="14" fill="#0a0a0a" stroke="url(#limeStroke)" stroke-width="6"/>
    <path d="M195 150 v-26 a20 20 0 0 1 20 -20 h10 a20 20 0 0 1 20 20 v26" fill="none" stroke="url(#limeStroke)" stroke-width="6"/>
    <line x1="150" y1="200" x2="290" y2="200" stroke="#e8ff00" stroke-width="4"/>
  </g>

  <rect width="1600" height="900" fill="url(#fadeBottom)"/>
</svg>
