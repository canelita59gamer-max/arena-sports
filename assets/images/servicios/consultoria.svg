<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlowCons" cx="38%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#182200"/>
      <stop offset="45%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <filter id="glowCons" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="fadeBottomCons" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGlowCons)"/>

  <!-- tactics board -->
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="740" height="560" rx="18" fill="url(#boardGrad)" stroke="#2a2a2a" stroke-width="3"/>

    <!-- half-court lines -->
    <g fill="none" stroke="#3a3a3a" stroke-width="2">
      <rect x="40" y="40" width="660" height="480" rx="6"/>
      <circle cx="370" cy="280" r="90"/>
      <line x1="370" y1="40" x2="370" y2="520"/>
      <rect x="40" y="180" width="120" height="200"/>
      <rect x="580" y="180" width="120" height="200"/>
    </g>

    <!-- glowing play diagram -->
    <g filter="url(#glowCons)" fill="none" stroke="#c8f000" stroke-width="5" stroke-linecap="round">
      <path d="M140 420 C 240 340, 300 460, 400 300 S 560 160, 640 140" stroke-dasharray="2 22"/>
      <path d="M140 420 L 260 260 L 400 300"/>
      <path d="M400 300 L 520 380 L 640 140" stroke-dasharray="10 14"/>
    </g>

    <!-- X and O markers -->
    <g stroke="#e8ff00" stroke-width="5" stroke-linecap="round">
      <line x1="120" y1="400" x2="160" y2="440"/>
      <line x1="160" y1="400" x2="120" y2="440"/>
    </g>
    <circle cx="400" cy="300" r="18" fill="none" stroke="#e8ff00" stroke-width="5"/>
    <g stroke="#e8ff00" stroke-width="5" stroke-linecap="round">
      <line x1="620" y1="120" x2="660" y2="160"/>
      <line x1="660" y1="120" x2="620" y2="160"/>
    </g>
    <circle cx="260" cy="260" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5"/>
    <circle cx="520" cy="380" r="18" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="5"/>
  </g>

  <!-- clipboard edge glint -->
  <rect x="430" y="120" width="740" height="6" fill="#c8f000" opacity="0.5"/>

  <rect width="1600" height="900" fill="url(#fadeBottomCons)"/>
</svg>
